{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | VitalShop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container px-4 px-lg-5">

        <a class="navbar-brand" href="/">
            Vital<span>Shop</span>
        </a>

    </div>

</nav>


<section class="py-5">

    <div class="container">

        <div
            class="card shadow-sm mx-auto"
            style="max-width: 500px;"
        >

            <div class="card-body p-4">

                <h2 class="fw-bold text-center mb-4">
                    Create Account
                </h2>


                {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            name="password2"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >

                        Create Account

                    </button>

                </form>


                <p class="text-center mt-4 mb-0">

                    Already have an account?

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</section>

</body>

</html>
